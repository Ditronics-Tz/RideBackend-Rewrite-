name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history with fully redacted output
        run: gitleaks git --redact=100 --no-banner --config .gitleaks.toml --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --log-opts=--all
      - name: Verify clean and planted-key scanner fixtures
        run: python3 scripts/check-secret-scan.py
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/ride_test?sslmode=disable
      RUN_POSTGRES_MIGRATION_TESTS: "1"
      RUN_POSTGRES_AUTH_TESTS: "1"
      RUN_POSTGRES_FINANCE_TESTS: "1"
      RUN_POSTGRES_PROMO_TESTS: "1"
      RUN_POSTGRES_VERIFICATION_TESTS: "1"
      RUN_POSTGRES_RIDE_TESTS: "1"
      APP_ENV: development
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ride_test
      DB_SSLMODE: disable
      JWT_SECRET: ci_app_secret_32_bytes_minimum_value
      STAFF_JWT_SECRET: ci_staff_secret_32_bytes_minimum_value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: go build ./...
