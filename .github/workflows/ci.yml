name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history with fully redacted output
        run: gitleaks git --redact=100 --no-banner --config .gitleaks.toml --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --log-opts=--all
      - name: Verify clean and planted-key scanner fixtures
        run: python3 scripts/check-secret-scan.py
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...
